<style>
:root{--bg:#f3f6fc;--card:#fff;--ink:#1d2b4f;--mute:#5d6a8a;--line:#d5dcec;--navy:#243f7d;--yel:#ffc928;--ok:#1f8a4c;--okbg:#e3f5ea;--no:#c23a3a;--nobg:#fbe7e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2e;--card:#1b2542;--ink:#eef2ff;--mute:#9eabcc;--line:#33406a;--navy:#8fb0ff;--ok:#6fdc9a;--okbg:#17372a;--no:#ff8f8f;--nobg:#432127}}
:root[data-theme="dark"]{--bg:#121a2e;--card:#1b2542;--ink:#eef2ff;--mute:#9eabcc;--line:#33406a;--navy:#8fb0ff;--ok:#6fdc9a;--okbg:#17372a;--no:#ff8f8f;--nobg:#432127}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2rem;margin:8px 0 0;color:var(--navy);letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 16px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--yel);transition:width .3s}
.count{font-size:.9rem;color:var(--mute);margin-bottom:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px}
h2{font-size:1.25rem;margin:0 0 12px;line-height:1.35}
.card img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin-bottom:14px;display:block}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.opt b{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;font-size:.95rem;color:var(--mute)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--nobg);border-color:var(--no)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.98rem}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--nobg);color:var(--no)}
.fb span{color:var(--ink)}
.btn{margin-top:16px;font:inherit;font-weight:700;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:12px 22px;cursor:pointer}
:root[data-theme="dark"] .btn,@media(prefers-color-scheme:dark){}
.big{font-size:3rem;font-weight:800;color:var(--navy);margin:0}
.hid{display:none}
.rev{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.rev li{padding:8px 12px;border-radius:10px;background:var(--bg);font-size:.95rem}
.rev .y{border-left:5px solid var(--ok)}.rev .n{border-left:5px solid var(--no)}
</style></head><body><main>

function pick(k){
 const q=Q[i],bs=document.querySelectorAll('.opt'),good=k===q.a;
